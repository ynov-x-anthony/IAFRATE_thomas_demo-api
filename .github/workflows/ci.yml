name: Docker CI - Microservices

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

jobs:
  image:
    name: Build et scan - ${{ matrix.service }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [api, notifier]

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Preparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ${{ matrix.service == 'api' && './api/Dockerfile.multi' || './notifier/Dockerfile' }}
          load: true
          tags: demo-${{ matrix.service }}:ci

      - name: Scanner avec Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: demo-${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Connexion a GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}:${GITHUB_REF_NAME}"
          docker tag demo-${{ matrix.service }}:ci "$IMAGE"
          docker push "$IMAGE"
